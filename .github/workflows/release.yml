name: Private versioned release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag and repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = json.loads(Path('VERSION.json').read_text())['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + expected:
              raise SystemExit('Tag does not match VERSION.json')
          PY
          test "$(gh repo view --json isPrivate --jq .isPrivate)" = true
      - name: Run regression and build
        run: |
          mkdir -p 03_KNOWLEDGE/master-research/inbox 03_KNOWLEDGE/master-research/ready-for-skill 03_KNOWLEDGE/master-research/processed
          python 05_AUTOMATION/scripts/validate_system.py
          python -m unittest discover -s 06_QA/tests -v
          python 05_AUTOMATION/scripts/build_release.py --version "${GITHUB_REF_NAME#v}" --audit 06_QA/evidence-audit-20261106.json
          python 05_AUTOMATION/scripts/export_plugin.py --release "dist/ai-film-system-${GITHUB_REF_NAME#v}"
      - name: Create private repository Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/ai-film-system-$version.zip" \
            "dist/ai-film-system-$version.zip.sha256" \
            "dist/ai-film-studio-plugin-$version.zip" \
            "dist/ai-film-studio-plugin-$version.zip.sha256" \
            --title "AI Film Studio $version" \
            --notes "Private release. Client installation and film project files require separate acceptance."
